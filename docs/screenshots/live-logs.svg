<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <rect width="1200" height="700" fill="#0d0f14"/>
  <rect x="0" y="0" width="1200" height="56" fill="#12151c"/>
  <circle cx="30" cy="28" r="10" fill="#4f7cff"/>
  <text x="52" y="34" fill="#e8eaf0" font-size="18" font-family="'Space Grotesk', sans-serif" font-weight="600">Logs en direct</text>
  <circle cx="1150" cy="28" r="5" fill="#4ee69a"/>
  <text x="1080" y="34" fill="#8b93a7" font-size="12">connecté</text>

  <rect x="24" y="80" width="220" height="596" rx="8" fill="#12151c" stroke="#242938"/>
  <text x="40" y="106" fill="#8b93a7" font-size="12" font-family="'Space Grotesk', sans-serif">PROCESS</text>
  <g font-size="13">
    <rect x="36" y="122" width="192" height="30" rx="6" fill="#1c2130"/>
    <text x="48" y="142" fill="#e8eaf0">api-gateway</text>
    <text x="48" y="176" fill="#8b93a7">worker-queue</text>
    <text x="48" y="210" fill="#8b93a7">cron-reports</text>
    <text x="48" y="244" fill="#8b93a7">notifications-svc</text>
  </g>

  <rect x="260" y="80" width="916" height="596" rx="8" fill="#0a0c10" stroke="#242938"/>
  <g font-size="12.5">
    <text x="278" y="112" fill="#5c657a">2026-08-30 09:12:04</text>
    <text x="460" y="112" fill="#4ee69a">[stdout]</text>
    <text x="530" y="112" fill="#c7cbd6">Server listening on port 4200</text>

    <text x="278" y="136" fill="#5c657a">2026-08-30 09:12:05</text>
    <text x="460" y="136" fill="#4ee69a">[stdout]</text>
    <text x="530" y="136" fill="#c7cbd6">GET /api/health 200 3ms</text>

    <text x="278" y="160" fill="#5c657a">2026-08-30 09:12:07</text>
    <text x="460" y="160" fill="#f2c94c">[stderr]</text>
    <text x="530" y="160" fill="#f2c94c">Slow query detected (412ms) — orders#list</text>

    <text x="278" y="184" fill="#5c657a">2026-08-30 09:12:09</text>
    <text x="460" y="184" fill="#4ee69a">[stdout]</text>
    <text x="530" y="184" fill="#c7cbd6">Queue job 8823 completed in 92ms</text>

    <text x="278" y="208" fill="#5c657a">2026-08-30 09:12:12</text>
    <text x="460" y="208" fill="#4ee69a">[stdout]</text>
    <text x="530" y="208" fill="#c7cbd6">Webhook delivered to slack-alerts</text>

    <text x="278" y="232" fill="#5c657a">2026-08-30 09:12:14</text>
    <text x="460" y="232" fill="#f25c5c">[stderr]</text>
    <text x="530" y="232" fill="#f25c5c">ECONNRESET at fetchUpstream (retry 1/3)</text>

    <text x="278" y="256" fill="#5c657a">2026-08-30 09:12:15</text>
    <text x="460" y="256" fill="#4ee69a">[stdout]</text>
    <text x="530" y="256" fill="#c7cbd6">Retry succeeded, upstream healthy</text>
  </g>

  <rect x="278" y="640" width="880" height="8" rx="4" fill="#1c2130"/>
  <text x="278" y="672" fill="#5c657a" font-size="12">auto-scroll actif · WebSocket</text>

  <!-- placeholder watermark -->
  <rect x="0" y="0" width="1200" height="700" fill="#0b0d12" opacity="0.55"/>
  <text x="600" y="340" text-anchor="middle" fill="#e8eaf0" font-size="26" font-weight="700" font-family="'Space Grotesk', sans-serif">Aperçu illustratif — pas une vraie capture</text>
  <text x="600" y="372" text-anchor="middle" fill="#8b93a7" font-size="15" font-family="'Space Grotesk', sans-serif">À remplacer par une capture réelle des logs en direct — voir docs/screenshots/README.md</text>
